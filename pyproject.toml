[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mcache-sdk"
version = "0.1.0"
description = "Python SDK for mcache — HTTP and gRPC clients"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcache", "cache", "grpc", "http"]
dependencies = [
    "requests>=2.31",
    "grpcio>=1.64",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcache*"]
